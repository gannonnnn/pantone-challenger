[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pantone-challenger"
version = "1.5.2"
description = "An open cultural color index for how color begins, spreads, converges, and becomes ordinary."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Pantone Challenger contributors"}]
dependencies = [
  "beautifulsoup4>=4.12.3",
  "feedparser>=6.0.11",
  "httpx>=0.28.1",
  "numpy>=2.0.0",
  "Pillow>=11.0.0",
  "playwright>=1.50.0",
  "PyYAML>=6.0.2",
  "python-dateutil>=2.9.0.post0",
  "rich>=13.9.4",
  "typer>=0.15.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.4",
]

[project.scripts]
challenger = "challenger.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["challenger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["archive", ".work", "site"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
