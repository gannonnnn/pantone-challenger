methodology_version: "1.6.0"
timezone: "America/New_York"

capture:
  viewport:
    width: 1440
    height: 1200
  # Runtime controls: one shared browser, bounded sources, and a graceful global budget.
  browser_workers: 6
  api_workers: 3
  browser_source_timeout_s: 55
  api_source_timeout_s: 45
  collection_budget_s: 1200
  heartbeat_seconds: 20
  navigation_timeout_ms: 18000
  network_idle_timeout_ms: 3000
  element_timeout_ms: 4000
  screenshot_timeout_ms: 6000
  overlay_timeout_s: 3
  post_load_wait_ms: 700
  visual_wait_ms: 1000
  http_timeout_s: 12
  max_fallback_urls: 1
  max_nodes_per_selector: 28
  max_regions_per_source: 3
  max_candidate_regions: 6

palette:
  colors_per_region: 7
  neutral_chroma: 0.035

clustering:
  oklab_distance: 0.050
  candidate_distinctness: 0.040
  min_local_share: 0.055
  min_salience: 0.025
  min_component_share: 0.006
  min_spatial_coverage: 0.125
  proof_mask_distance: 0.035

baseline:
  compatibility_key: "cohort-evidence-v2"
  history_days: 30
  calibration_days: 7
  min_days_for_trend: 7
  min_source_days: 5
  min_comparable_days: 5
  min_cohort_sources: 6
  min_cohort_coverage: 0.50
  min_change_percentage_points: 5.0
  identity_frequency: 0.70

# Stable benchmark sources run every day. Discovery sources rotate across domains.
discovery:
  sources_per_run: 18

scoring:
  target_domains: 7
  emergence_weights:
    novelty: 0.25
    cross_domain: 0.25
    cross_stage: 0.20
    velocity: 0.15
    small_large: 0.10
    quality: 0.05

quality:
  min_coverage_block: 0.30
  min_coverage_ready: 0.55
  min_evidence_sources_block: 12
  min_evidence_sources_ready: 24
  min_domains_block: 4
  min_domains_ready: 7
  min_stages_block: 2
  min_stages_ready: 3
  min_supporting_sources: 6
  min_supporting_domains: 4
  min_runner_sources: 4
  min_runner_domains: 3
  min_emergence_score: 55.0
  max_top_source_weight: 0.25
  max_top_domain_weight: 0.45
  max_top_platform_weight: 0.40
  min_score_margin: 3.0
  require_observed_display_hex: true
  require_observed_local_hex: true
  max_cluster_diameter: 0.050
  min_mean_component_share: 0.006

neutral_gate:
  min_baseline_days: 14
  min_velocity: 0.70
  min_sources: 10
  min_domains: 6
  max_top_source_weight: 0.20

ties:
  score_difference: 2.5
  max_co_challengers: 2

palette_pairs:
  min_score: 0.20

dedupe:
  cross_source_phash_distance: 6

# Balancing constraints are reported even when the current sample is smaller.
balancing:
  benchmark_share_target: 0.50
  discovery_share_target: 0.50
  max_platform_share: 0.10
  max_domain_share: 0.15
  max_creator_share: 0.02
