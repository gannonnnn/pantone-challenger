project_name: "Pantone Challenger"
methodology_version: "1.3.0"
timezone: "America/New_York"
rollover_hour: 4

viewport_width: 1440
viewport_height: 1200
frames_per_source: 2
second_frame_scroll_y: 900
navigation_timeout_ms: 45000
post_load_wait_ms: 3500
concurrency: 3
request_delay_seconds: 1.0

# V1.3 analyzes traceable marketing-creative regions, not whole webpages.
max_regions_per_source: 3
max_region_candidates_per_frame: 8
min_region_width: 280
min_region_height: 180
min_region_viewport_area: 0.04
min_region_confidence: 0.65

cluster_distance: 0.055
source_cluster_distance: 0.045
recurrence_distance: 0.055
runner_distinct_distance: 0.040
evidence_max_distance: 0.055

baseline_lookback_days: 30
baseline_warmup_days: 7
calibration_days: 7
baseline_suppression: 0.75
unchanged_page_factor: 0.35

# Neutrals remain measurable, but cannot casually become early public winners.
display_min_chroma: 0.040
neutral_warmup_days: 14
neutral_min_momentum_ratio: 2.0
neutral_min_sources: 10
neutral_min_sectors: 6

# A calibration package may be produced with the lower thresholds. A public-ready
# result requires the stronger thresholds and an established baseline.
min_review_sources: 20
min_review_sectors: 7
min_review_region_coverage_ratio: 0.40
min_ready_sources: 30
min_ready_sectors: 9
min_ready_region_coverage_ratio: 0.60

min_winner_sources: 6
min_winner_sectors: 4
min_winner_evidence_regions: 4
min_mean_evidence_confidence: 0.68
max_mean_evidence_distance: 0.045
max_evidence_distance: 0.055
max_source_weight: 0.30
max_sector_weight: 0.50
min_score_margin: 2.5

min_runner_sources: 5
min_runner_sectors: 3
min_candidates: 1
raw_capture_retention_days: 14
