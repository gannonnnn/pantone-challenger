name: Daily Challenger

# V1.3 is manual-only during evidence calibration. Restore a schedule only after
# seven accepted shadow runs and explicit approval.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Marketing date (YYYY-MM-DD) or auto"
        required: true
        default: "auto"
      max_sources:
        description: "0 uses the full 48-source panel"
        required: true
        default: "0"
      force:
        description: "Rebuild an existing date"
        type: boolean
        required: true
        default: false

concurrency:
  group: daily-challenger
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      REQUESTED_DATE: ${{ github.event.inputs.date || 'auto' }}
      MAX_SOURCES: ${{ github.event.inputs.max_sources || '0' }}
      FORCE_INPUT: ${{ github.event.inputs.force || 'false' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install application
        run: |
          python -m pip install -e .
          python -m playwright install --with-deps chromium

      - name: Capture and calculate
        id: run
        shell: bash
        run: |
          target_date="$(python - <<PY
          from challenger.config import load_settings
          from challenger.dates import resolve_marketing_date
          settings = load_settings('config')
          print(resolve_marketing_date(
              '$REQUESTED_DATE',
              timezone_name=settings.timezone,
              rollover_hour=settings.rollover_hour,
          ).isoformat())
          PY
          )"
          echo "target_date=$target_date" >> "$GITHUB_OUTPUT"

          args=(--date "$REQUESTED_DATE")
          if [[ "$MAX_SOURCES" != "0" ]]; then
            args+=(--max-sources "$MAX_SOURCES")
          fi
          if [[ "$FORCE_INPUT" == "true" ]]; then
            args+=(--force)
          fi
          challenger run "${args[@]}" | tee daily-run.json

          if [[ ! -f "archive/$target_date/result.json" ]]; then
            echo "No result record was generated for $target_date."
            exit 1
          fi
          result_status="$(python - <<PY
          import json
          from pathlib import Path
          print(json.loads((Path('archive') / '$target_date' / 'result.json').read_text())['status'])
          PY
          )"
          echo "result_status=$result_status" >> "$GITHUB_OUTPUT"

      - name: Upload private capture and evidence review
        if: always() && steps.run.outputs.target_date != ''
        uses: actions/upload-artifact@v7
        with:
          name: private-evidence-${{ steps.run.outputs.target_date }}
          path: |
            .work/captures/${{ steps.run.outputs.target_date }}/
            .work/review/${{ steps.run.outputs.target_date }}/
            archive/${{ steps.run.outputs.target_date }}/capture-report.json
            archive/${{ steps.run.outputs.target_date }}/result.json
            archive/${{ steps.run.outputs.target_date }}/review-summary.md
          retention-days: 14
          if-no-files-found: warn

      - name: Upload review package
        if: steps.run.outputs.result_status == 'ready' || steps.run.outputs.result_status == 'review_only'
        uses: actions/upload-artifact@v7
        with:
          name: challenger-review-${{ steps.run.outputs.target_date }}
          path: archive/${{ steps.run.outputs.target_date }}/
          retention-days: 30
          if-no-files-found: error

      - name: Write run summary
        if: always() && steps.run.outputs.target_date != ''
        shell: bash
        run: |
          python - "${{ steps.run.outputs.target_date }}" <<'PY'
          import json
          import sys
          from pathlib import Path
          day = sys.argv[1]
          result = json.loads((Path('archive') / day / 'result.json').read_text())
          lines = [
              f"# Pantone Challenger — {day}",
              "",
              f"**State:** `{result['status']}`",
              f"**Coverage:** {result['captured_sources']} / {result['panel_size']} company pages",
          ]
          if result.get('winner'):
              winner = result['winner']
              lines.extend([
                  f"**Candidate:** {result.get('winner_name')} `{winner['hex']}`",
                  f"**Traceable support:** {winner['source_count']} companies / {winner['sector_count']} sectors",
              ])
          reasons = result.get('quality_gate', {}).get('reasons', [])
          warnings = result.get('quality_gate', {}).get('warnings', [])
          if reasons:
              lines.extend(["", "## Blocking reasons", *[f"- {x}" for x in reasons]])
          if warnings:
              lines.extend(["", "## Warnings", *[f"- {x}" for x in warnings]])
          Path('/tmp/summary.md').write_text('\n'.join(lines))
          PY
          cat /tmp/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update review pull request
        if: steps.run.outputs.result_status == 'ready' || steps.run.outputs.result_status == 'review_only'
        shell: bash
        run: |
          day="${{ steps.run.outputs.target_date }}"
          status="${{ steps.run.outputs.result_status }}"
          if [[ "$status" == "review_only" ]]; then
            branch="calibration/$day"
          else
            branch="daily/$day"
          fi
          git config user.name "pantone-challenger[bot]"
          git config user.email "pantone-challenger[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add "archive/$day" site
          git commit -m "daily: record Challenger evidence for $day" || true
          git push --force-with-lease origin "$branch"
          sha="$(git rev-parse HEAD)"

          python - "$day" "$sha" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          day, sha = sys.argv[1:]
          result = json.loads((Path('archive') / day / 'result.json').read_text())
          winner = result.get('winner') or {}
          repo = os.environ['GITHUB_REPOSITORY']
          base = f"https://github.com/{repo}/blob/{sha}/archive/{day}"
          state = result['status']
          title_prefix = (
              "INTERNAL CALIBRATION — DO NOT POST"
              if state == "review_only"
              else "Yesterday's Challenger"
          )
          notice = (
              "> **Calibration only:** merging this PR saves baseline history. It does not "
              "enter the public archive, recurrence counter, or social-publishing queue."
              if state == "review_only"
              else "> Merging approves this measured result for the public archive."
          )
          evidence = []
          for item in winner.get('evidence', [])[:12]:
              evidence.append(
                  f"- **{item['source_name']}** — {item['sector'].replace('_', ' ')} · "
                  f"local swatch `{item['local_hex']}` · distance {item['distance_to_candidate']:.3f}"
              )
          lines = [
              f"# {title_prefix} — {day}",
              "",
              notice,
              "",
              f"![Candidate card]({base}/feed-post.png?raw=1)",
              "",
              "## Coverage",
              "",
              f"- **{result['captured_sources']} / {result['panel_size']}** company pages produced eligible creative evidence",
              f"- **{winner.get('source_count', 0)} companies / {winner.get('sector_count', 0)} sectors** support the candidate",
              f"- **State:** `{state}` · **Confidence:** {winner.get('confidence', 'unknown')}",
              "",
              "## Traceable source matches",
              "",
              *(evidence or ["- No qualifying source evidence."]),
              "",
              f"![Evidence cards]({base}/story-02-evidence.png?raw=1)",
              "",
              f"![Runners-up]({base}/story-04-runners-up.png?raw=1)",
              "",
              f"[Open review summary]({base}/review-summary.md) · "
              f"[Open result JSON]({base}/result.json) · "
              f"[Open capture report]({base}/capture-report.json)",
              "",
              "> A logo is never color evidence. Every displayed company must have a local "
              "swatch from a traceable sampled creative region.",
          ]
          Path('/tmp/pr-body.md').write_text('\n'.join(lines), encoding='utf-8')
          Path('/tmp/pr-title.txt').write_text(f"{title_prefix} — {day}", encoding='utf-8')
          PY

          title="$(cat /tmp/pr-title.txt)"
          open_pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$open_pr" ]]; then
            gh pr edit "$open_pr" --title "$title" --body-file /tmp/pr-body.md
          else
            gh pr create --base main --head "$branch" --title "$title" --body-file /tmp/pr-body.md
          fi

      - name: Publication blocked safely
        if: steps.run.outputs.result_status == 'blocked'
        run: |
          echo "The workflow completed normally, but no public or calibration result cleared the evidence gates."
          echo "Review the private-evidence artifact and the run summary."
