name: CI

on:
  push:
    branches: [main, "v1-*", "fix/**", "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit and regression tests
        run: pytest
      - name: Lint
        run: ruff check challenger tests scripts
      - name: Validate temporal and semantic integrity
        run: python scripts/validate_temporal_integrity.py

      - name: Validate source registry and release
        run: python scripts/validate_release.py
