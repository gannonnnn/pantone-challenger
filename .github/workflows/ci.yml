name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Install Chromium for capture regression tests
        run: python -m playwright install --with-deps chromium

      - name: Unit and regression tests
        env:
          REQUIRE_CAPTURE_BROWSER_TEST: "1"
        run: pytest

      - name: Critical Python lint
        run: ruff check challenger tests scripts --select E9,F63,F7,F82

      - name: Validate temporal and semantic integrity
        run: python scripts/validate_temporal_integrity.py

      - name: Validate bounded runtime controls
        run: python scripts/validate_runtime.py

      - name: Validate source registry and release
        run: python scripts/validate_release.py
