name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Unit and regression tests
        run: pytest

      - name: Critical Python lint
        run: ruff check challenger tests scripts --select E9,F63,F7,F82

      - name: Validate source registry and release
        run: python scripts/validate_release.py
