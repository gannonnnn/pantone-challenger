name: Publish approved social package

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Archive date or latest"
        required: true
        default: "latest"
      platform:
        description: "Social platform"
        type: choice
        options: ["instagram", "bluesky"]
        required: true
        default: "instagram"
      include_stories:
        description: "Publish Instagram Story cards"
        type: boolean
        required: true
        default: false
      force_retry:
        description: "Danger: ignore a stale publish lock only after checking the social account"
        type: boolean
        required: true
        default: false

concurrency:
  group: social-publisher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      REQUESTED_DATE: ${{ github.event.inputs.date || 'latest' }}
      REQUESTED_PLATFORM: ${{ github.event.inputs.platform || vars.PUBLISH_PLATFORM || 'instagram' }}
      INCLUDE_STORIES: ${{ github.event.inputs.include_stories || vars.INCLUDE_STORIES || 'false' }}
      FORCE_RETRY: ${{ github.event.inputs.force_retry || 'false' }}
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - run: python -m pip install -e .

      - name: Resolve date and reserve publication
        id: reserve
        shell: bash
        run: |
          if [[ "$REQUESTED_DATE" == "latest" || "$REQUESTED_DATE" == "auto" ]]; then
            date="$(python - <<'PY'
          from pathlib import Path
          from challenger.archive import latest_ready_date
          value = latest_ready_date(Path("archive"))
          if not value:
              raise SystemExit("No ready result exists")
          print(value)
          PY
          )"
          else
            date="$REQUESTED_DATE"
          fi
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

          platform="$REQUESTED_PLATFORM"
          lock="publish-lock-$platform-$date"
          done_tag="published-$platform-$date"
          git fetch --tags --force

          if git rev-parse "$done_tag" >/dev/null 2>&1; then
            echo "This package was already published: $done_tag"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse "$lock" >/dev/null 2>&1; then
            if [[ "$FORCE_RETRY" != "true" ]]; then
              echo "A publish lock exists without a completion tag."
              echo "Check the social account before retrying; this prevents duplicate posts."
              exit 1
            fi
            git tag -d "$lock" || true
            git push origin ":refs/tags/$lock" || true
          fi

          git config user.name "pantone-challenger[bot]"
          git config user.email "pantone-challenger[bot]@users.noreply.github.com"
          git tag -a "$lock" -m "Reserved $platform publication for $date"
          git push origin "$lock"

      - name: Publish
        if: steps.reserve.outputs.skip != 'true'
        shell: bash
        run: |
          args=(--platform "$REQUESTED_PLATFORM" --date "${{ steps.reserve.outputs.date }}" --approve)
          if [[ "$REQUESTED_PLATFORM" == "instagram" && "$INCLUDE_STORIES" == "true" ]]; then
            args+=(--include-stories)
          fi
          challenger publish "${args[@]}"

      - name: Record completion
        if: steps.reserve.outputs.skip != 'true'
        shell: bash
        run: |
          date="${{ steps.reserve.outputs.date }}"
          platform="$REQUESTED_PLATFORM"
          done_tag="published-$platform-$date"
          git add -f "archive/$date/published.json"
          git commit -m "publish: record $platform receipt for $date"
          git push origin HEAD:main
          git tag -a "$done_tag" -m "Published $platform package for $date"
          git push origin "$done_tag"
