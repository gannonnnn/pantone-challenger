name: Publish approved social package

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Approved ready date in YYYY-MM-DD"
        required: true
      platform:
        description: "Destination"
        required: true
        type: choice
        options: [bluesky, instagram]
      dry_run:
        description: "Validate only; do not post"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Publish or dry-run
        shell: bash
        run: |
          FLAG="--dry-run"
          if [[ "${{ github.event.inputs.dry_run }}" == "false" ]]; then FLAG="--no-dry-run"; fi
          challenger publish --date "${{ github.event.inputs.date }}" --platform "${{ github.event.inputs.platform }}" --public-base-url "$PUBLIC_BASE_URL" $FLAG
