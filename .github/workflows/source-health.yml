name: Source health

on:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * 1"

permissions:
  contents: read

jobs:
  health:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_SOURCE_HEALTH_SCHEDULE == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
      ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
      EBAY_OAUTH_TOKEN: ${{ secrets.EBAY_OAUTH_TOKEN }}
      PRODUCT_HUNT_TOKEN: ${{ secrets.PRODUCT_HUNT_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - run: python -m playwright install --with-deps chromium
      - name: Check declared sources without publishing
        id: health
        continue-on-error: true
        run: timeout --signal=TERM --kill-after=30s 22m python scripts/source_health.py --output .work/source-health
      - name: Upload source-health evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-health-${{ github.run_id }}
          path: .work/source-health
          if-no-files-found: warn
          retention-days: 14
      - name: Fail after preserving diagnostics
        if: steps.health.outcome == 'failure'
        run: exit 1
