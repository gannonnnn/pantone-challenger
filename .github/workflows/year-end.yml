name: Year-End Challenger

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Calendar year, or previous"
        required: true
        default: previous
  schedule:
    - cron: "30 14 2 1 *"

permissions:
  contents: write
  pull-requests: write

jobs:
  summarize:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_YEAR_END_SCHEDULE == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Resolve year
        id: year
        shell: bash
        run: |
          VALUE="${{ github.event.inputs.year || 'previous' }}"
          if [[ "$VALUE" == "previous" ]]; then VALUE=$(( $(date +%Y) - 1 )); fi
          echo "value=$VALUE" >> "$GITHUB_OUTPUT"
      - run: challenger year-end --year "${{ steps.year.outputs.value }}" --archive archive
      - uses: actions/upload-artifact@v4
        with:
          name: year-in-color-${{ steps.year.outputs.value }}
          path: archive/yearly/${{ steps.year.outputs.value }}/
      - name: Open review pull request
        shell: bash
        run: |
          YEAR="${{ steps.year.outputs.value }}"
          BRANCH="year-end/$YEAR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add "archive/yearly/$YEAR"
          git commit -m "data: add $YEAR Year in Color" || true
          git push --force-with-lease origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "$YEAR Year in Color — review" --body-file "archive/yearly/$YEAR/annual-summary.md" || true
